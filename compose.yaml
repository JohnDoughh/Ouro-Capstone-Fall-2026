services:
  evaluation-lab:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - lab-data:/lab/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  lab-data:
