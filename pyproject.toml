[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ouro-evaluation-lab"
version = "0.1.0"
description = "Public-safe multimodal evaluator calibration and abstention lab"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ouro Capstone Contributors"}]

[project.scripts]
ouro-eval-lab = "ouro_eval_lab.cli:main"

[tool.setuptools]
packages = ["ouro_eval_lab"]

[tool.setuptools.package-data]
ouro_eval_lab = ["web/*"]
